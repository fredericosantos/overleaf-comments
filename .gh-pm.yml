project:
    name: overleaf-comments
    number: 18
    owner: fredericosantos
repositories:
    - fredericosantos/overleaf-comments
defaults:
    priority: medium
    status: backlog
    labels:
        - pm-tracked
fields:
    priority:
        field: Priority
        values:
            critical: Critical
            high: High
            low: Low
            medium: Medium
    status:
        field: Status
        values:
            backlog: Backlog
            done: Done
            in_progress: In Progress
            review: Review
            todo: Todo
triage:
    estimate:
        query: is:issue is:open -has:estimate
        apply: {}
        interactive:
            estimate: true
    tracked:
        query: is:issue is:open -label:pm-tracked
        apply:
            labels:
                - pm-tracked
            fields:
                priority: p1
                status: backlog
        interactive:
            status: true
